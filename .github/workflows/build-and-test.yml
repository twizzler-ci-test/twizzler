name: Build and Test

on:
  workflow_run:
    workflows: ["Release"] # must match the Release workflow's 'name'
    types: [completed]
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  LLVM_CONFIG_PATH: llvm-config-18
  CC: clang-18
  CXX: clang++-18
  LD: clang++-18

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Cleanup
        run: |
          ls -la 
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - id: setup
        uses: ./.github/actions/setup
      - name: Bootstrap Toolchain
        run: cargo +nightly toolchain pull
      - name: Build x86_64
        run: cargo +nightly build-all
      - name: Test x86_64 Debug
        run: cargo +nightly start-qemu --tests --qemu-options=--nographic
      - name: Test x86_64 Release
        run: cargo +nightly start-qemu --profile release --tests --qemu-options=--nographic --gdb 0
      # aarch64 is compiled for QEMU virt, builds in debug mode
      - name: Build aarch64
        run: cargo +nightly build-all -a aarch64 -m virt
